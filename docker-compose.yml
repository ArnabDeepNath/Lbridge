# Local development database (production: any managed Postgres 14+).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bridge
      POSTGRES_PASSWORD: bridge
      POSTGRES_DB: lbeauty_bridge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Production-style layout: one web container + N worker containers from the
  # same image. `docker compose --profile prod up --scale worker=3`
  web:
    profiles: ["prod"]
    build: .
    env_file: .env
    ports:
      - "3000:3000"
    depends_on: [db]

  worker:
    profiles: ["prod"]
    build: .
    env_file: .env
    command: ["npm", "run", "worker"]
    depends_on: [db]

volumes:
  pgdata:
