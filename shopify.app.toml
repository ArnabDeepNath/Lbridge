# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "fd77ecddff8c7efa0418e2e93d5c97e5"
name = "L-Beauty Order Bridge"
embedded = true
application_url = "https://lbridge-nine.vercel.app"
api_version = "2026-10"

[access_scopes]
# Admin order-routing scopes plus Sales Channel and Storefront checkout scopes.
scopes = "read_orders,write_orders,read_products,read_product_listings,write_resource_feedbacks,read_resource_feedbacks,read_fulfillments,write_fulfillments,read_merchant_managed_fulfillment_orders,write_merchant_managed_fulfillment_orders,unauthenticated_read_product_listings,unauthenticated_write_checkouts,unauthenticated_read_checkouts"
optional_scopes = []
use_legacy_install_flow = false

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "/webhooks/compliance"

  [[webhooks.subscriptions]]
  topics = ["product_feeds/full_sync"]
  uri = "/api/webhooks/feeds-full-sync"

  [[webhooks.subscriptions]]
  topics = ["product_feeds/full_sync_finish"]
  uri = "/api/webhooks/feeds-full-sync-finish"

  [[webhooks.subscriptions]]
  topics = ["product_feeds/incremental_sync"]
  uri = "/api/webhooks/feeds-incremental-sync"

  [[webhooks.subscriptions]]
  topics = ["product_feeds/update"]
  uri = "/api/webhooks/feeds-update"

[auth]
redirect_urls = [
  "https://lbridge-nine.vercel.app/auth/callback",
  "https://lbridge-nine.vercel.app/auth/shopify/callback",
  "https://lbridge-nine.vercel.app/api/auth/callback"
]

[build]
automatically_update_urls_on_dev = true
