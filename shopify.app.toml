# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "fd77ecddff8c7efa0418e2e93d5c97e5"
name = "L-Beauty Order Bridge"
embedded = true
application_url = "https://lbridge-nine.vercel.app"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,write_orders,read_products,read_fulfillments,write_fulfillments,read_merchant_managed_fulfillment_orders,write_merchant_managed_fulfillment_orders"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[auth]
redirect_urls = [
  "https://lbridge-nine.vercel.app/auth/callback",
  "https://lbridge-nine.vercel.app/auth/shopify/callback",
  "https://lbridge-nine.vercel.app/api/auth/callback"
]

[build]
automatically_update_urls_on_dev = true
